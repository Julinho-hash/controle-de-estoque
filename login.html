<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle de Estoque</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        h1 { text-align: center; color: #1e3a8a; margin-bottom: 30px; font-size: 24px; }
        input {
            width: 100%; padding: 14px; margin: 10px 0 20px;
            border: 2px solid #ddd; border-radius: 8px;
            font-size: 16px; outline: none;
        }
        input:focus { border-color: #3b82f6; }
        button {
            width: 100%; padding: 14px;
            background: #1e3a8a; color: white;
            border: none; border-radius: 8px;
            font-size: 18px; font-weight: bold; cursor: pointer;
        }
        button:hover { background: #3b82f6; }
        .erro { color: red; text-align: center; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 Acesso ao Sistema</h1>
        <input type="password" id="senha" placeholder="Digite a senha de acesso">
        <button onclick="entrar()">Entrar no Sistema</button>
        <div class="erro" id="msgErro">Senha incorreta! Tente novamente.</div>
    </div>

    <script>
        // 🔐 SENHA DE ACESSO — PODE MUDAR AQUI!
        const SENHA_CORRETA = "123456";

        function entrar() {
            const senha = document.getElementById('senha').value;
            if (senha === SENHA_CORRETA) {
                localStorage.setItem('logado', 'sim');
                window.location.href = 'index.html';
            } else {
                document.getElementById('msgErro').style.display = 'block';
                document.getElementById('senha').value = '';
            }
        }

        // Aperta Enter pra entrar
        document.getElementById('senha').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') entrar();
        });
    </script>
</body>
</html>
